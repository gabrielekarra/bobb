[project]
name = "bobbd"
version = "0.1.0"
description = "Bobb's on-device decision daemon: typed, calibrated readouts over a resident local model, gated to a unix socket."
requires-python = "==3.12.*"
dependencies = [
    "mlx",
    "mlx-lm>=0.31.3,<0.32",
    "numpy",
    "pillow",
    "torch>=2.6,<2.9",
    "kokoro-onnx>=0.4.9,<0.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires loading the resident model",
]
