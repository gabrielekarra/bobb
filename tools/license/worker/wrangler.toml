name = "bobb-licenses"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# The production public key: `uv run python ../license_tool.py public --key <signing key>`.
PUBLIC_KEY = ""
# Lemon Squeezy variant ids for each edition.
VARIANT_PERSONAL = ""
VARIANT_PRO = ""
FROM_EMAIL = "Bobb <licenses@bobb.app>"
SUPPORT_EMAIL = "support@bobb.app"

# Secrets, never in this file:
#   wrangler secret put WEBHOOK_SECRET    # Lemon Squeezy webhook signing secret
#   wrangler secret put SIGNING_KEY       # contents of the signing key file
#   wrangler secret put RESEND_API_KEY
